services:
  postgres:
    image: postgres:16-bookworm
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ../../configs/postgresql/common-16gb.conf:/etc/postgresql/conf.d/10-common.conf:ro
    command:
      - postgres
      - -c
      - config_file=/var/lib/postgresql/data/postgresql.conf
      - -c
      - include_if_exists=/etc/postgresql/conf.d/10-common.conf
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-app} -d ${POSTGRES_DB:-app}"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
