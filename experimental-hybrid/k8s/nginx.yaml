apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-config
  namespace: onec-hybrid
data:
  default.conf: |
    server {
      listen 80;
      server_name _;
      location / {
        proxy_pass http://onec-app:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: onec-nginx
  namespace: onec-hybrid
spec:
  replicas: 1
  selector:
    matchLabels:
      app: onec-nginx
  template:
    metadata:
      labels:
        app: onec-nginx
    spec:
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: 25m
              memory: 24Mi
            limits:
              cpu: 250m
              memory: 96Mi
          volumeMounts:
            - name: config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
      volumes:
        - name: config
          configMap:
            name: nginx-config
---
apiVersion: v1
kind: Service
metadata:
  name: onec-nginx
  namespace: onec-hybrid
spec:
  selector:
    app: onec-nginx
  ports:
    - port: 80
      targetPort: 80
