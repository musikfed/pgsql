# Lab baseline: PostgreSQL 16, ~16 GB RAM, SSD/NVMe.
# Adapt after measurement.

shared_buffers = '4GB'
effective_cache_size = '12GB'
maintenance_work_mem = '1GB'
work_mem = '16MB'

checkpoint_timeout = '15min'
checkpoint_completion_target = 0.9
max_wal_size = '8GB'
min_wal_size = '2GB'
wal_compression = on

random_page_cost = 1.1
effective_io_concurrency = 200
default_statistics_target = 200

track_io_timing = on
log_checkpoints = on
log_lock_waits = on
log_min_duration_statement = '2s'

max_connections = 200
