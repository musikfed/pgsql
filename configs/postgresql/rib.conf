# RIB / intensive exchange profile.
# RIB behavior is defined by 1C; this only adapts PostgreSQL for write bursts.

max_wal_size = '16GB'
min_wal_size = '4GB'
wal_compression = on
checkpoint_timeout = '15min'
checkpoint_completion_target = 0.95

autovacuum = on
autovacuum_max_workers = 8
autovacuum_naptime = '10s'
autovacuum_vacuum_scale_factor = 0.03
autovacuum_analyze_scale_factor = 0.01

log_checkpoints = on
log_lock_waits = on
