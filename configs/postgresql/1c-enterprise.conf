# Experimental 1C:Enterprise-oriented PostgreSQL profile.
# Verify platform compatibility and tune on real workload.

max_connections = 300
work_mem = '16MB'
maintenance_work_mem = '1GB'

autovacuum = on
autovacuum_max_workers = 6
autovacuum_naptime = '10s'
autovacuum_vacuum_scale_factor = 0.05
autovacuum_analyze_scale_factor = 0.02

log_lock_waits = on
deadlock_timeout = '1s'
track_io_timing = on

# Enable only after checking application behavior:
# idle_in_transaction_session_timeout = '15min'

# Safety: do not disable durability for performance.
fsync = on
full_page_writes = on
synchronous_commit = on
