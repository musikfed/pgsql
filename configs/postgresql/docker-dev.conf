# Small development profile for docker quick start.
# Deliberately much smaller than common-16gb.conf.

shared_buffers = '256MB'
effective_cache_size = '768MB'
maintenance_work_mem = '128MB'
work_mem = '4MB'
max_connections = 100

checkpoint_timeout = '10min'
checkpoint_completion_target = 0.9
max_wal_size = '2GB'
min_wal_size = '512MB'
wal_compression = on

random_page_cost = 1.1
track_io_timing = on
log_min_duration_statement = '2s'
