services:
  etcd1:
    image: ${ETCD_IMAGE:-quay.io/coreos/etcd:v3.5.15}
    command:
      - /usr/local/bin/etcd
      - --name=etcd1
      - --data-dir=/etcd-data
      - --listen-client-urls=http://0.0.0.0:2379
      - --advertise-client-urls=http://etcd1:2379
      - --listen-peer-urls=http://0.0.0.0:2380
      - --initial-advertise-peer-urls=http://etcd1:2380
      - --initial-cluster=etcd1=http://etcd1:2380,etcd2=http://etcd2:2380,etcd3=http://etcd3:2380
      - --initial-cluster-state=new
      - --initial-cluster-token=pgsql-lab
    volumes: [etcd1:/etcd-data]

  etcd2:
    image: ${ETCD_IMAGE:-quay.io/coreos/etcd:v3.5.15}
    command:
      - /usr/local/bin/etcd
      - --name=etcd2
      - --data-dir=/etcd-data
      - --listen-client-urls=http://0.0.0.0:2379
      - --advertise-client-urls=http://etcd2:2379
      - --listen-peer-urls=http://0.0.0.0:2380
      - --initial-advertise-peer-urls=http://etcd2:2380
      - --initial-cluster=etcd1=http://etcd1:2380,etcd2=http://etcd2:2380,etcd3=http://etcd3:2380
      - --initial-cluster-state=new
      - --initial-cluster-token=pgsql-lab
    volumes: [etcd2:/etcd-data]

  etcd3:
    image: ${ETCD_IMAGE:-quay.io/coreos/etcd:v3.5.15}
    command:
      - /usr/local/bin/etcd
      - --name=etcd3
      - --data-dir=/etcd-data
      - --listen-client-urls=http://0.0.0.0:2379
      - --advertise-client-urls=http://etcd3:2379
      - --listen-peer-urls=http://0.0.0.0:2380
      - --initial-advertise-peer-urls=http://etcd3:2380
      - --initial-cluster=etcd1=http://etcd1:2380,etcd2=http://etcd2:2380,etcd3=http://etcd3:2380
      - --initial-cluster-state=new
      - --initial-cluster-token=pgsql-lab
    volumes: [etcd3:/etcd-data]

  patroni1:
    build: .
    image: ${PATRONI_IMAGE:-pgsql-patroni:16-lab}
    depends_on: [etcd1, etcd2, etcd3]
    environment:
      PATRONI_NAME: patroni1
      PATRONI_SCOPE: pgsql-lab
      PATRONI_ETCD3_HOSTS: etcd1:2379,etcd2:2379,etcd3:2379
      PATRONI_RESTAPI_CONNECT_ADDRESS: patroni1:8008
      PATRONI_POSTGRESQL_CONNECT_ADDRESS: patroni1:5432
      PATRONI_SUPERUSER_USERNAME: postgres
      PATRONI_SUPERUSER_PASSWORD: ${POSTGRES_PASSWORD}
      PATRONI_REPLICATION_USERNAME: replicator
      PATRONI_REPLICATION_PASSWORD: ${REPLICATION_PASSWORD}
    volumes: [patroni1:/var/lib/postgresql/patroni]

  patroni2:
    image: ${PATRONI_IMAGE:-pgsql-patroni:16-lab}
    depends_on: [patroni1]
    environment:
      PATRONI_NAME: patroni2
      PATRONI_SCOPE: pgsql-lab
      PATRONI_ETCD3_HOSTS: etcd1:2379,etcd2:2379,etcd3:2379
      PATRONI_RESTAPI_CONNECT_ADDRESS: patroni2:8008
      PATRONI_POSTGRESQL_CONNECT_ADDRESS: patroni2:5432
      PATRONI_SUPERUSER_USERNAME: postgres
      PATRONI_SUPERUSER_PASSWORD: ${POSTGRES_PASSWORD}
      PATRONI_REPLICATION_USERNAME: replicator
      PATRONI_REPLICATION_PASSWORD: ${REPLICATION_PASSWORD}
    volumes: [patroni2:/var/lib/postgresql/patroni]

  patroni3:
    image: ${PATRONI_IMAGE:-pgsql-patroni:16-lab}
    depends_on: [patroni1]
    environment:
      PATRONI_NAME: patroni3
      PATRONI_SCOPE: pgsql-lab
      PATRONI_ETCD3_HOSTS: etcd1:2379,etcd2:2379,etcd3:2379
      PATRONI_RESTAPI_CONNECT_ADDRESS: patroni3:8008
      PATRONI_POSTGRESQL_CONNECT_ADDRESS: patroni3:5432
      PATRONI_SUPERUSER_USERNAME: postgres
      PATRONI_SUPERUSER_PASSWORD: ${POSTGRES_PASSWORD}
      PATRONI_REPLICATION_USERNAME: replicator
      PATRONI_REPLICATION_PASSWORD: ${REPLICATION_PASSWORD}
    volumes: [patroni3:/var/lib/postgresql/patroni]

  haproxy:
    image: haproxy:3.0-alpine
    depends_on: [patroni1, patroni2, patroni3]
    ports:
      - "5000:5000"
      - "5001:5001"
    volumes:
      - ./haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro

volumes:
  etcd1:
  etcd2:
  etcd3:
  patroni1:
  patroni2:
  patroni3:
