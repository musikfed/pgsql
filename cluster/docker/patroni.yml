scope: pgsql-lab
namespace: /service/

restapi:
  listen: 0.0.0.0:8008

postgresql:
  listen: 0.0.0.0:5432
  data_dir: /var/lib/postgresql/patroni
  bin_dir: /usr/lib/postgresql/16/bin
  pgpass: /var/lib/postgresql/.pgpass
  parameters:
    max_connections: 200
    shared_buffers: 512MB
    wal_level: replica
    hot_standby: "on"
    wal_compression: "on"
    max_wal_senders: 10
    max_replication_slots: 10
    password_encryption: scram-sha-256

bootstrap:
  dcs:
    ttl: 30
    loop_wait: 10
    retry_timeout: 10
    maximum_lag_on_failover: 1048576
    postgresql:
      use_pg_rewind: true
      use_slots: true
  initdb:
    - encoding: UTF8
    - data-checksums

tags:
  nofailover: false
  noloadbalance: false
  clonefrom: false
  nosync: false
