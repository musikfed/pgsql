apiVersion: v1
kind: ConfigMap
metadata:
  name: patroni-haproxy-config
  namespace: pgsql-lab
data:
  haproxy.cfg: |
    global
      log stdout format raw local0

    defaults
      log global
      mode tcp
      timeout connect 5s
      timeout client 30s
      timeout server 30s

    frontend postgres_write
      bind *:5000
      default_backend postgres_primary

    backend postgres_primary
      option httpchk GET /primary
      http-check expect status 200
      server patroni0 patroni-0.patroni:5432 check port 8008
      server patroni1 patroni-1.patroni:5432 check port 8008
      server patroni2 patroni-2.patroni:5432 check port 8008

    frontend postgres_read
      bind *:5001
      default_backend postgres_replicas

    backend postgres_replicas
      option httpchk GET /replica
      http-check expect status 200
      server patroni0 patroni-0.patroni:5432 check port 8008
      server patroni1 patroni-1.patroni:5432 check port 8008
      server patroni2 patroni-2.patroni:5432 check port 8008
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: patroni-haproxy
  namespace: pgsql-lab
spec:
  replicas: 1
  selector:
    matchLabels:
      app: patroni-haproxy
  template:
    metadata:
      labels:
        app: patroni-haproxy
    spec:
      containers:
        - name: haproxy
          image: haproxy:3.0-alpine
          ports:
            - containerPort: 5000
            - containerPort: 5001
          volumeMounts:
            - name: config
              mountPath: /usr/local/etc/haproxy/haproxy.cfg
              subPath: haproxy.cfg
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
      volumes:
        - name: config
          configMap:
            name: patroni-haproxy-config
---
apiVersion: v1
kind: Service
metadata:
  name: patroni-haproxy
  namespace: pgsql-lab
spec:
  selector:
    app: patroni-haproxy
  ports:
    - name: primary
      port: 5000
      targetPort: 5000
    - name: replicas
      port: 5001
      targetPort: 5001
