apiVersion: v1
kind: Service
metadata:
  name: etcd
  namespace: pgsql-lab
spec:
  clusterIP: None
  selector:
    app: etcd
  ports:
    - name: client
      port: 2379
    - name: peer
      port: 2380
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: etcd
  namespace: pgsql-lab
spec:
  serviceName: etcd
  replicas: 3
  selector:
    matchLabels:
      app: etcd
  template:
    metadata:
      labels:
        app: etcd
    spec:
      containers:
        - name: etcd
          image: quay.io/coreos/etcd:v3.5.15
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          command: ["/bin/sh","-ec"]
          args:
            - |
              exec /usr/local/bin/etcd                 --name="$POD_NAME"                 --data-dir=/etcd-data                 --listen-client-urls=http://0.0.0.0:2379                 --advertise-client-urls="http://$POD_NAME.etcd:2379"                 --listen-peer-urls=http://0.0.0.0:2380                 --initial-advertise-peer-urls="http://$POD_NAME.etcd:2380"                 --initial-cluster="etcd-0=http://etcd-0.etcd:2380,etcd-1=http://etcd-1.etcd:2380,etcd-2=http://etcd-2.etcd:2380"                 --initial-cluster-state=new                 --initial-cluster-token=pgsql-k8s-lab
          ports:
            - containerPort: 2379
            - containerPort: 2380
          volumeMounts:
            - name: data
              mountPath: /etcd-data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 2Gi
